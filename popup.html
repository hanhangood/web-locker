<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>网页锁</title>
  <link rel="stylesheet" href="assets/smartisan.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body class="s-page wl-popup">

    <path d="M12 16.6V18.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="si-lock-open" viewBox="0 0 24 24" fill="none">
    <path d="M7.4 10V7.6C7.4 5.06 9.46 3 12 3C14.24 3 16.1 4.6 16.5 6.72" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <rect x="4.6" y="10" width="14.8" height="11.4" rx="3.4" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="15.2" r="1.5" fill="currentColor"/>
    <path d="M12 16.6V18.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="si-folder" viewBox="0 0 24 24" fill="none">

  <symbol id="si-setting" viewBox="0 0 20 20" fill="none">

</svg>

<header class="s-appbar s-appbar--shadow">
  <div class="s-appbar__title">网页锁</div>
  <div class="s-appbar__spacer"></div>
  <div class="s-appbar__actions">
    <button id="btn-lock-now" title="立即上锁" aria-label="立即上锁" hidden>
      <svg class="s-icon s-icon--20"><use href="#si-lock"/></svg>
    </button>
    <button id="btn-settings" title="管理" aria-label="管理">
      <svg class="s-icon s-icon--20"><use href="#si-setting"/></svg>
    </button>
  </div>
</header>

<main class="wl-popup__body">

  <!-- ============ 打开扩展先验密码 ============ -->
  <section id="view-lock">
    <div class="wl-lock-badge" style="margin-top:18px">
      <svg class="s-icon"><use href="#si-lock"/></svg>
    </div>
    <h2 class="wl-lock-title" style="font-size:17px;margin-top:16px">扩展已上锁</h2>
    <p class="wl-lead" style="margin:6px 0 16px">输入密码才能查看和管理锁定项</p>
    <input class="s-textfield" type="password" id="lock-pw" placeholder="密码" autocomplete="current-password" />
    <p class="wl-error" id="lock-err"></p>
    <button class="s-btn s-btn--block" id="btn-unlock-popup">解锁</button>
    <p class="wl-hint wl-hint--center">和打开被锁网页时用的是同一个密码</p>
  </section>

  <!-- ============ 首次使用 ============ -->
  <section id="view-setup" hidden>
    <div class="wl-lock-badge" style="margin-top:14px">
      <svg class="s-icon"><use href="#si-lock"/></svg>
    </div>
    <p class="wl-lead">先设一个密码。<br>之后打开被锁的网页，都要先输它。</p>
    <input class="s-textfield" type="password" id="setup-pw1" placeholder="设置密码（至少 4 位）" autocomplete="new-password" />
    <input class="s-textfield wl-mt8" type="password" id="setup-pw2" placeholder="再输一次" autocomplete="new-password" />
    <p class="wl-error" id="setup-err"></p>
    <button class="s-btn s-btn--block wl-mt12" id="btn-setup">设置密码</button>
    <p class="wl-hint wl-hint--center">密码只保存在本机，忘记后只能重装扩展。</p>
  </section>

  <!-- ============ 主界面 ============ -->
  <section id="view-main" hidden>
    <div class="s-list-group">
      <div class="s-list-group__header">当前网页</div>
      <ul class="s-list">
        <li class="s-list-item">
          <img class="wl-favicon" id="cur-fav" alt="" />
          <div class="s-list-item__text">
            <div class="s-list-item__title wl-ellipsis" id="cur-title">—</div>
            <div class="s-list-item__subtitle wl-ellipsis" id="cur-host">—</div>
          </div>
          <span class="s-chip s-chip--grey" id="cur-state">未锁</span>
        </li>
      </ul>
    </div>
    <button class="s-btn s-btn--block wl-mt12" id="btn-add">锁定此网页</button>

    <div class="s-list-group wl-mt20">
      <div class="s-list-group__header">已加锁</div>
      <ul class="s-list" id="lock-list"></ul>
      <div id="lock-empty" class="wl-empty" hidden>
        <svg class="s-icon"><use href="#si-star"/></svg>
        <div class="wl-empty__title">还没锁任何东西</div>
        <div class="wl-empty__desc">在下面打开管理页，<br>从收藏夹里挑网页或整个文件夹上锁。</div>
      </div>
      <p class="wl-hint wl-hint--center" id="lock-desc"></p>
    </div>

    <button class="s-btn s-btn--outline s-btn--block wl-mt16" id="btn-manage">打开管理页</button>
  </section>

  <!-- ============ 锁定当前网页 ============ -->
  <section id="view-add" hidden>
    <button class="s-btn s-btn--text" id="btn-add-back" style="margin-bottom:10px">← 返回</button>
    <div class="s-list-group">
      <div class="s-list-group__header">要锁的地址</div>
      <ul class="s-list">
        <li class="s-list-item">
          <img class="wl-favicon" id="add-fav" alt="" />
          <div class="s-list-item__text">
            <div class="s-list-item__title wl-ellipsis" id="add-title">—</div>
            <div class="s-list-item__subtitle wl-ellipsis" id="add-url">—</div>
          </div>
        </li>
      </ul>
    </div>

    <div class="s-list-group wl-mt20">
      <div class="s-list-group__header">锁定范围</div>
      <div class="wl-choices" id="mode-choices">
        <button class="wl-choice is-on" data-mode="domain">整个网站</button>
        <button class="wl-choice" data-mode="prefix">此地址开头</button>
        <button class="wl-choice" data-mode="exact">仅这一个地址</button>
      </div>
      <p class="wl-hint" id="mode-hint">该站点的所有页面都会上锁。</p>
    </div>

    <div class="wl-mt20" id="add-pw-wrap">
      <input class="s-textfield" type="password" id="add-pw" placeholder="输入密码确认" autocomplete="current-password" />
    </div>
    <p class="wl-error" id="add-err"></p>
    <button class="s-btn s-btn--block wl-mt8" id="btn-add-confirm">确认上锁</button>
  </section>

</main>

<script src="assets/smartisan.js" defer></script>
<script type="module" src="popup.js"></script>
</body>
</html>
