<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>网页已锁定</title>
  <link rel="stylesheet" href="assets/smartisan.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body class="s-page s-page--textured wl-lock-page">

<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <symbol id="si-lock" viewBox="0 0 24 24" fill="none">
    <path d="M7.4 10V7.6C7.4 5.06 9.46 3 12 3C14.54 3 16.6 5.06 16.6 7.6V10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <rect x="4.6" y="10" width="14.8" height="11.4" rx="3.4" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="15.2" r="1.5" fill="currentColor"/>
    <path d="M12 16.6V18.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="si-folder" viewBox="0 0 24 24" fill="none">
    <path d="M3.2 7.4C3.2 6.5 3.9 5.8 4.8 5.8H9.1L11 8.1H19.2C20.1 8.1 20.8 8.8 20.8 9.7V17.6C20.8 18.5 20.1 19.2 19.2 19.2H4.8C3.9 19.2 3.2 18.5 3.2 17.6V7.4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>
</svg>

<div class="wl-lock-shell">
  <div class="wl-lock-brand">网页锁 · 受保护页面</div>

  <div class="wl-lock-card" id="card">
    <div class="wl-lock-badge">
      <svg class="s-icon"><use href="#si-lock"/></svg>
    </div>

    <h1 class="wl-lock-title" id="lock-title">这个网页被锁住了</h1>
    <p class="wl-lock-sub" id="lock-sub">输入密码才能继续</p>

    <div class="wl-lock-site">
      <img class="wl-favicon wl-favicon--lg" id="site-fav" alt="" />
      <div class="wl-lock-site__text">
        <div class="wl-lock-site__host" id="site-host">…</div>
        <div class="wl-lock-site__url" id="site-url">…</div>
      </div>
    </div>

    <div class="wl-lock-form">
      <input class="s-textfield" type="password" id="pw" placeholder="请输入密码" autocomplete="current-password" />
      <p class="wl-error" id="err"></p>
      <button class="s-btn s-btn--block" id="btn-unlock">解锁并进入</button>
      <button class="s-btn s-btn--block" id="btn-done" hidden style="margin-top:10px">完成</button>
    </div>

    <div class="wl-lock-foot">
      <button class="s-btn s-btn--text" id="btn-back">返回上一页</button>
      <button class="s-btn s-btn--text" id="btn-close">关闭此页</button>
    </div>
  </div>
</div>

<script src="assets/smartisan.js" defer></script>
<script type="module" src="lock.js"></script>
</body>
</html>
